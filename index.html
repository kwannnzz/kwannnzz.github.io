<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00338D">
    <title>kwannnzz</title>
    <link href="index_files/sig.ico" rel="shortcut icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #00338D;
            --cobalt: #1E49E2;
            --pacific: #00B8F5;
            --sky: #ACEAFF;
            --violet: #7213EA;
            --navy: #0C233C;
            --text-main: #0C233C;
            --text-sub: #526071;
            --line: rgba(0, 51, 141, 0.10);
            --glass: rgba(255, 255, 255, 0.72);
            --glass-strong: rgba(255, 255, 255, 0.92);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background: #f4f8fd;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 56px 20px 40px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            will-change: transform;
        }

        .blob.b1 {
            width: 460px;
            height: 460px;
            background: var(--pacific);
            top: -140px;
            left: -120px;
            animation: drift1 18s ease-in-out infinite;
        }

        .blob.b2 {
            width: 420px;
            height: 420px;
            background: var(--cobalt);
            bottom: -160px;
            right: -120px;
            opacity: 0.35;
            animation: drift2 22s ease-in-out infinite;
        }

        .blob.b3 {
            width: 280px;
            height: 280px;
            background: var(--violet);
            top: 45%;
            left: 60%;
            opacity: 0.18;
            animation: drift3 26s ease-in-out infinite;
        }

        .blob.b4 {
            width: 320px;
            height: 320px;
            background: var(--sky);
            bottom: 10%;
            left: -80px;
            opacity: 0.6;
            animation: drift2 20s ease-in-out infinite reverse;
        }

        @keyframes drift1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(80px, 60px) scale(1.12);
            }
        }

        @keyframes drift2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-70px, -50px) scale(1.08);
            }
        }

        @keyframes drift3 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(-90px, 40px);
            }

            66% {
                transform: translate(40px, -60px);
            }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 51, 141, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 51, 141, 0.045) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Cursor glow */
        .cursor-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle, rgba(30, 73, 226, 0.12), transparent 65%);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 164px;
            height: 164px;
            margin-bottom: 22px;
            display: grid;
            place-items: center;
        }

        .avatar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--primary), var(--cobalt), var(--pacific), var(--sky), var(--violet), var(--primary));
            animation: spin 6s linear infinite;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: inherit;
            filter: blur(18px);
            opacity: 0.45;
            z-index: -1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .avatar {
            position: relative;
            width: 152px;
            height: 152px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid #ffffff;
            background: #fff;
            transition: transform 0.5s var(--ease);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.04);
        }


        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--glass-strong);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 4px 14px rgba(0, 51, 141, 0.08);
            margin-bottom: 14px;
            letter-spacing: 0.02em;
            min-height: 30px;
        }

        .role-pill .dot {
            width: 6px;
            height: 6px;
            background: var(--pacific);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(0, 184, 245, 0.2);
        }

        .typed::after {
            content: '|';
            margin-left: 2px;
            color: var(--cobalt);
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .signature-box {
            margin: 4px 0 22px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signature {
            max-height: 100%;
            width: auto;
            object-fit: contain;
            clip-path: inset(0 100% 0 0);
            animation: write 1.8s var(--ease) 0.6s forwards;
        }

        @keyframes write {
            to {
                clip-path: inset(0 0 0 0);
            }
        }

        .vcard-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: linear-gradient(120deg, var(--primary), var(--cobalt), var(--primary));
            background-size: 200% 100%;
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 10px 24px -6px rgba(0, 51, 141, 0.45);
            transition: transform 0.3s var(--ease), box-shadow 0.3s ease, background-position 0.6s ease;
            overflow: hidden;
        }

        .vcard-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 3.6s ease-in-out 2.4s infinite;
        }

        @keyframes shine {
            0% {
                left: -75%;
            }

            40%,
            100% {
                left: 130%;
            }
        }

        .vcard-btn:hover {
            transform: translateY(-2px);
            background-position: 100% 0;
            box-shadow: 0 16px 30px -8px rgba(30, 73, 226, 0.55);
        }

        .vcard-btn svg {
            width: 16px;
            height: 16px;
        }


        /* Action row */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 34px;
        }

        .qr-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--glass-strong);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--primary);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px -8px rgba(0, 51, 141, 0.25);
            transition: transform 0.3s var(--ease), box-shadow 0.3s ease;
        }

        .qr-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(0, 51, 141, 0.35);
        }

        .qr-btn svg {
            width: 16px;
            height: 16px;
        }

        .icon-zalo {
            background: #e5f0ff;
            color: #0068FF;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: -0.02em;
        }

        /* QR modal */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(12, 35, 60, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            position: relative;
            width: 100%;
            max-width: 320px;
            background: #fff;
            border-radius: 24px;
            padding: 28px 24px 22px;
            text-align: center;
            box-shadow: 0 30px 60px -20px rgba(12, 35, 60, 0.45);
            transform: translateY(16px) scale(0.96);
            transition: transform 0.4s var(--ease);
        }

        .modal.open .modal-card {
            transform: none;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 0;
            background: #f1f5f9;
            color: var(--text-sub);
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .modal-close svg {
            width: 16px;
            height: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-sub {
            font-size: 12.5px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .qr-frame {
            position: relative;
            margin: 18px auto 0;
            width: 220px;
            height: 220px;
            padding: 12px;
            border-radius: 18px;
            background: #fff;
            border: 1px solid var(--line);
            overflow: hidden;
        }

        #qr-code {
            width: 100%;
            height: 100%;
        }

        .qr-frame svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-frame::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 40px;
            top: -40px;
            background: linear-gradient(180deg, transparent, rgba(0, 184, 245, 0.25), transparent);
            animation: scan 2.6s ease-in-out infinite;
        }

        @keyframes scan {
            0% {
                top: -40px;
            }

            100% {
                top: 100%;
            }
        }

        .qr-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 3px solid #fff;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Sections */
        .section {
            width: 100%;
            margin-bottom: 22px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin: 0 4px 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--line), transparent);
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            --mx: 50%;
            --my: 50%;
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: 14px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 10px 30px -10px rgba(0, 51, 141, 0.10);
            transition: transform 0.35s var(--ease), box-shadow 0.35s ease, border-color 0.3s ease;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .link-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(260px circle at var(--mx) var(--my), rgba(0, 184, 245, 0.16), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .link-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 18%;
            bottom: 18%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(var(--cobalt), var(--pacific));
            transform: scaleY(0);
            transition: transform 0.35s var(--ease);
        }

        .link-card:hover {
            box-shadow: 0 22px 40px -12px rgba(0, 51, 141, 0.22);
            border-color: rgba(0, 184, 245, 0.35);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-card:hover::after {
            transform: scaleY(1);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.4s var(--ease);
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
        }

        .link-card:hover .icon-box {
            transform: rotate(-8deg) scale(1.08);
        }

        .icon-linkedin {
            background: #e1efff;
            color: #0A66C2;
        }

        .icon-phone {
            background: #e0f8f5;
            color: #098E7E;
        }

        .icon-mail {
            background: #eaf0ff;
            color: var(--cobalt);
        }

        .icon-fb {
            background: #e8edfb;
            color: #1877F2;
        }

        .icon-insta {
            background: #fde8f3;
            color: #AB0D82;
        }

        .card-titles {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .card-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 12.5px;
            color: var(--text-sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            z-index: 1;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #94a3b8;
            background: transparent;
            border: 0;
            cursor: pointer;
            transition: all 0.25s var(--ease);
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        .btn-icon.copy:hover {
            background: #fff;
            color: var(--cobalt);
            box-shadow: 0 4px 10px rgba(0, 51, 141, 0.1);
        }

        .link-card:hover .arrow {
            color: var(--primary);
            transform: translate(2px, -2px);
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 184, 245, 0.25);
            transform: scale(0);
            animation: ripple 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        footer {
            margin-top: 18px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        footer a {
            color: inherit;
            text-decoration: none;
            background: linear-gradient(var(--cobalt), var(--cobalt)) left bottom / 0 1px no-repeat;
            transition: background-size 0.3s ease, color 0.3s ease;
        }

        footer a:hover {
            color: var(--cobalt);
            background-size: 100% 1px;
        }

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 24px);
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--navy);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s var(--ease);
            box-shadow: 0 12px 30px rgba(12, 35, 60, 0.3);
        }

        .toast svg {
            width: 16px;
            height: 16px;
            color: var(--pacific);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(18px);
            filter: blur(4px);
            transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), filter 0.7s var(--ease);
        }

        .reveal.in {
            opacity: 1;
            transform: none;
            filter: none;
        }

        @media (max-width: 420px) {
            body {
                padding: 40px 14px 32px;
            }

            .avatar-wrapper {
                width: 140px;
                height: 140px;
            }

            .avatar {
                width: 130px;
                height: 130px;
            }

            .link-card {
                padding: 12px 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
                filter: none;
            }

            .signature {
                clip-path: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
    </div>
    <div class="grid-overlay"></div>

                <a href="tel:+84392557927" class="link-card reveal">
                    <div class="link-left">
                        <div class="icon-box icon-phone"><i data-feather="phone-call"></i></div>
                        <div class="card-titles">
                            <span class="card-title">+84 392 557 927</span>
                            <span class="card-subtitle">Phone</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <span class="btn-icon copy" role="button" tabindex="0" data-copy="+84392557927"
                            aria-label="Copy phone number"><i data-feather="copy"></i></span>
                        <span class="btn-icon arrow"><i data-feather="arrow-up-right"></i></span>

                        <div class="icon-box icon-zalo">Zalo</div>
                        <div class="card-titles">
                            <span class="card-title">Zalo</span>
                            <span class="card-subtitle">+84 392 557 927</span>

    <div class="modal" id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-title">
        <div class="modal-card">
            <button type="button" class="modal-close" id="qr-close" aria-label="Close"><i data-feather="x"></i></button>
            <div class="modal-title" id="qr-title">Scan to save contact</div>
            <div class="modal-sub">Point your phone camera at the code</div>
            <div class="qr-frame">
                <div id="qr-code"></div>
                <img src="index_files/avatar.jpeg" alt="" class="qr-logo"
                    onerror="this.src='https://github.com/kwannnzz.png'">
            </div>
        </div>

    <div class="toast" id="toast"><i data-feather="check-circle"></i><span id="toast-text">Copied</span></div>

    <script>
        feather.replace();

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const finePointer = window.matchMedia('(pointer: fine)').matches;

        // Staggered reveal
        document.querySelectorAll('.reveal').forEach((el, i) => {
            setTimeout(() => el.classList.add('in'), reduceMotion ? 0 : 80 + i * 70);
        });

        // Typing effect
        (function () {
            const el = document.getElementById('typed');
            const phrases = ['Tax Advisory • KPMG Vietnam', 'Corporate Tax', 'Ho Chi Minh City'];
            if (reduceMotion) { el.textContent = phrases[0]; return; }
            let p = 0, c = 0, deleting = false;
            function tick() {
                const word = phrases[p];
                el.textContent = word.slice(0, c);
                if (!deleting && c < word.length) { c++; setTimeout(tick, 55); }
                else if (!deleting) { deleting = true; setTimeout(tick, 2200); }
                else if (c > 0) { c--; setTimeout(tick, 28); }
                else { deleting = false; p = (p + 1) % phrases.length; setTimeout(tick, 350); }
            }
            setTimeout(tick, 500);
        })();

        // Card tilt, spotlight and ripple
        document.querySelectorAll('.link-card').forEach(card => {
            if (finePointer && !reduceMotion) {
                card.addEventListener('mousemove', e => {
                    const r = card.getBoundingClientRect();
                    const x = e.clientX - r.left, y = e.clientY - r.top;
                    card.style.setProperty('--mx', x + 'px');
                    card.style.setProperty('--my', y + 'px');
                    const rx = ((y / r.height) - 0.5) * -6;
                    const ry = ((x / r.width) - 0.5) * 6;
                    card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-3px)`;
                });
                card.addEventListener('mouseleave', () => { card.style.transform = ''; });
            }
            card.addEventListener('pointerdown', e => {
                const r = card.getBoundingClientRect();
                const size = Math.max(r.width, r.height);
                const s = document.createElement('span');
                s.className = 'ripple';
                s.style.width = s.style.height = size + 'px';
                s.style.left = (e.clientX - r.left - size / 2) + 'px';
                s.style.top = (e.clientY - r.top - size / 2) + 'px';
                card.appendChild(s);
                setTimeout(() => s.remove(), 650);
            });
        });

        // Copy to clipboard
        const toast = document.getElementById('toast');
        let toastTimer;
        const toastText = document.getElementById('toast-text');
        function showToast(msg) {
            toastText.textContent = msg;
            clearTimeout(toastTimer);
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }
        async function copyValue(btn) {
            try {
                await navigator.clipboard.writeText(btn.dataset.copy);
                showToast('Copied');
            } catch (_) { }
        }

        // Contact details (used for QR code and contact file)
        const CONTACT = {
            first: 'Quan',
            middle: 'Hoang Anh',
            last: 'Can',
            full: 'Quan Can Hoang Anh',
            org: 'KPMG Vietnam',
            phone: '+84392557927',
            email: 'quancan.7904@gmail.com',
            url: 'https://kwannnzz.github.io'
        };

        function buildVCard(c) {
            return [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${c.last};${c.first};${c.middle};;`,
                `FN:${c.full}`,
                `ORG:${c.org}`,
                `TEL;TYPE=CELL:${c.phone}`,
                `EMAIL;TYPE=INTERNET:${c.email}`,
                `URL:${c.url}`,
                'END:VCARD'
            ].join('\r\n');
        }

        // Add to contacts
        (function () {
            const btn = document.getElementById('vcard');
            const ua = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isAndroid = /Android/i.test(ua);
            const fileName = 'Quan-Can-Hoang-Anh.vcf';

            function saveBlob(text) {
                const blob = new Blob([text], { type: 'text/x-vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1500);
            }

            btn.addEventListener('click', async e => {
                if (isIOS) return;
                e.preventDefault();
                let text;
                try {
                    const res = await fetch(btn.getAttribute('href'), { cache: 'no-store' });
                    if (!res.ok) throw new Error();
                    text = await res.text();
                } catch (_) {
                    text = buildVCard(CONTACT);
                }
                saveBlob(text);
                showToast(isAndroid ? 'Tap the downloaded file to save' : 'Contact card downloaded');
            });
        })();

        // QR code
        (function () {
            const modal = document.getElementById('qr-modal');
            const holder = document.getElementById('qr-code');
            let rendered = false;

            function render() {
                if (rendered || typeof qrcode === 'undefined') return;
                const qr = qrcode(0, 'H');
                qr.addData(buildVCard(CONTACT));
                qr.make();
                holder.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
                const path = holder.querySelector('path');
                if (path) path.setAttribute('fill', '#00338D');
                rendered = true;
            }

            function open() {
                render();
                modal.classList.add('open');
                document.getElementById('qr-close').focus();
            }

            function close() {
                modal.classList.remove('open');
            }

            document.getElementById('qr-open').addEventListener('click', open);
            document.getElementById('qr-close').addEventListener('click', close);
            modal.addEventListener('click', e => { if (e.target === modal) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
        })();

        document.querySelectorAll('.copy').forEach(btn => {
            btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); copyValue(btn); });
            btn.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); copyValue(btn); }
            });
        });

        // Cursor glow
        const glow = document.getElementById('glow');
        if (finePointer && !reduceMotion) {
            let gx = 0, gy = 0, tx = 0, ty = 0;
            window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; glow.style.opacity = 1; });
            window.addEventListener('mouseleave', () => { glow.style.opacity = 0; });
            (function follow() {
                gx += (tx - gx) * 0.12; gy += (ty - gy) * 0.12;
                glow.style.left = gx + 'px'; glow.style.top = gy + 'px';
                requestAnimationFrame(follow);
            })();
        }

        // Particle network
        (function () {
            if (reduceMotion) return;
            const cv = document.getElementById('particles');
            const ctx = cv.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            let w, h, pts = [];
            const mouse = { x: -9999, y: -9999 };
            function resize() {
                w = cv.width = innerWidth * dpr;
                h = cv.height = innerHeight * dpr;
                cv.style.width = innerWidth + 'px';
                cv.style.height = innerHeight + 'px';
                const n = Math.min(70, Math.floor(innerWidth * innerHeight / 22000));
                pts = Array.from({ length: n }, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.3 * dpr, vy: (Math.random() - 0.5) * 0.3 * dpr,
                    r: (Math.random() * 1.6 + 0.8) * dpr
                }));
            }
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', e => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; });
            resize();
            const maxD = 130 * dpr;
            (function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const p of pts) {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
                    if (d < 120 * dpr) { p.x += dx / d * 0.6; p.y += dy / d * 0.6; }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(30, 73, 226, 0.35)';
                    ctx.fill();
                }
                for (let i = 0; i < pts.length; i++) {
                    for (let j = i + 1; j < pts.length; j++) {
                        const a = pts[i], b = pts[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < maxD) {
                            ctx.strokeStyle = `rgba(0, 51, 141, ${0.12 * (1 - d / maxD)})`;
                            ctx.lineWidth = dpr;
                            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            })();
        })();
    </script>
